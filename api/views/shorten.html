<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortened</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: "Roboto", sans-serif;
        background: azure;
        color: #222;
    }

    h1 {
        background: linear-gradient(90deg, midnightblue, darkslateblue);
        color: aliceblue;
        width: 100%;
        text-align: center;
        padding: 20px 10px;
        margin: 0 0 30px 0;
        font-family: "Roboto", sans-serif;
        font-weight: 700;
    }

    #main {
        width: min(90%, 800px);
        margin: 0 auto;
        text-align: center;
        font-family: "Roboto", sans-serif;
    }

    #main p {
        font-size: 18px;
    }

    #main a {
        color: midnightblue;
        font-weight: 700;
        word-break: break-word;
    }

    #copyButton {
        color: aliceblue;
        background: linear-gradient(90deg, midnightblue, darkslateblue);
        font-family: "Roboto", sans-serif;
        font-weight: 700;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        cursor: pointer;
        white-space: nowrap;
    }

    #copyButton:hover {
        opacity: 0.9;
    }
</style>
</head>
<body>

<h1>Shortened URL</h1>
<div id="main">
    <p>Your shortened URL is: <a href="/{{.ShortURL}}" target="_blank">{{.ShortURL}}</a></p>
    <button id="copyButton" data-url="{{.ShortURL}}">Copy to clipboard</button>
</div>
</body>
</html>
